# Pubblica il sito su GitHub Pages a ogni modifica del ramo main
# (anche quelle fatte dal cliente dall'area riservata).
name: Pubblica il sito

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # i video non stanno nel repository: sono allegati alla release «video»
      # (li carica l'area riservata) e vengono scaricati qui in video/
      - name: Scarica i video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p video
          if gh release view video >/dev/null 2>&1; then
            gh release download video -D video --clobber
          fi
          ls -la video

      - name: Genera portfolio e home dai lavori
        run: python3 scripts/genera_lavori.py

      - name: Prepara la cartella del sito
        run: |
          mkdir _site
          rsync -a --exclude='.*' --exclude='_site' --exclude='scripts' --exclude='data' --exclude='worker' --exclude='CLAUDE.md' ./ _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
